name: Publish an approved travel book
on:
  push:
    branches: [main]
    paths: ['published/current/**']
permissions:
  contents: read
  statuses: write
concurrency:
  group: memoryweaver-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved files
        run: python scripts/verify_release.py published/current
      - name: Verify Cloudflare configuration before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python scripts/setup_publishing.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy exactly the approved export
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy published/current --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
      - name: Return the deployment URL to the Publisher
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const target = process.env.DEPLOYMENT_URL;
            if (!target || !new URL(target).hostname.endsWith('.pages.dev')) throw new Error('Missing Pages URL');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'memoryweaver/cloudflare', target_url: target,
              description: 'Human-approved travel book deployed'
            });
      - name: Report a deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'memoryweaver/cloudflare', description: 'Inspect the failed workflow run'
            });
